services:
  dev:
    build:
      context: .
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      # node_modules reste dans le conteneur (volume anonyme), jamais mélangé avec l'hôte
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true

  prod:
    build:
      context: .
      target: prod
    ports:
      - "8080:80"
